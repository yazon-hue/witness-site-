<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WITNESS — Intelligence dashboard</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
<script type="module" src="/js/app.js"></script>
</head>
<body>
<main class="shell">
  <nav class="side" aria-label="Dashboard">
    <a href="#overview" data-v="overview"><span class="sq"></span>Overview</a>
    <a href="#explore" data-v="explore"><span class="sq"></span>Explore</a>
    <a href="/investigations"><span class="sq"></span>Investigations</a>
    <a href="#watchlists" data-v="watchlists"><span class="sq"></span>Watchlists</a>
    <a href="#submit" data-v="submit"><span class="sq"></span>Submit a discovery</a>
    <a href="/leaderboard"><span class="sq"></span>Leaderboard</a>
    <a href="#profile" data-v="profile"><span class="sq"></span>Profile</a>
  </nav>
  <div class="content">
    <div style="max-width:1180px;margin:0 auto" class="stack">
      <div class="page-head" style="margin-bottom:28px">
        <div class="stack" style="gap:6px"><div class="eyebrow" id="crumb">Dashboard</div><h1 id="heading" style="margin:0;font-size:30px;font-weight:600;letter-spacing:-.02em">Intelligence Overview</h1></div>
        <a class="btn btn-p" href="#submit">Submit a discovery</a>
      </div>
      <div id="view"></div>
    </div>
  </div>
</main>
</body>
</html>
